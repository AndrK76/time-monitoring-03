<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-content>
      <sc-login-dialog-content title="Вход в систему" submitLabel="Войти" cancelLabel="Отмена"
        extraLinkLabel="Нет аккаунта? Зарегистрироваться" extraLinkRoute="/register" [isLoading]="isLoading"
        [errorMessage]="errorMessage" (submitted)="onSubmit($event)" (cancelled)="onCancel()">
      </sc-login-dialog-content>
    </mat-card-content>
  </mat-card>
</div>
