<h2 mat-dialog-title>Смена пароля</h2>
<mat-dialog-content>
    <p *ngIf="data.username">Для пользователя: <strong>{{ data.username }}</strong></p>
    <form [formGroup]="form" class="password-form">
        <!-- Старый пароль (показывается только если showOldPassword) -->
        <mat-form-field *ngIf="data.showOldPassword" appearance="fill" class="full-width">
            <mat-label>Текущий пароль</mat-label>
            <input matInput type="password" formControlName="currentPassword" required>
            <mat-error *ngIf="form.get('currentPassword')?.hasError('required')">Введите текущий пароль</mat-error>
        </mat-form-field>
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Новый пароль</mat-label>
            <input matInput type="password" formControlName="newPassword" required>
            <mat-error *ngIf="form.get('newPassword')?.hasError('required')">Введите новый пароль</mat-error>
        </mat-form-field>
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Подтверждение пароля</mat-label>
            <input matInput type="password" formControlName="confirmPassword" required>
            <mat-error *ngIf="form.hasError('mismatch')">Пароли не совпадают</mat-error>
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="onSet()">
        Установить
    </button>
    <button mat-raised-button color="warn" *ngIf="data.resetAvailable" (click)="onReset()">
        Сбросить
    </button>
    <button mat-button (click)="onCancel()">Отмена</button>
</mat-dialog-actions>
