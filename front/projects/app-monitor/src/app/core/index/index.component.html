<div class="root-area">

    @if (isAuthenticated() ) {
    <app-main></app-main>
    } @else {
    <h1>Мониторинг</h1>
    <p>Пожалуйста, войдите или зарегистрируйтесь</p>
    <div class="auth-actions">
        <a routerLink="/login" class="link-button">Войти</a>
        <span class="separator">или</span>
        <a routerLink="/register" class="link-button">Зарегистрироваться</a>
    </div>
    }
</div>
