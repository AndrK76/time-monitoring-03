<!-- projects/app-admin/src/app/core/header/header.component.html -->
<mat-toolbar color="accent" class="header-toolbar">

    <!-- Левая часть: бренд -->
    <a class="brand-container" routerLink="/">
        <img src="logo.svg" width="30" height="24" alt="Логотип" class="logo">
        <span class="brand">Мониторинг</span>
    </a>


    @if (isAuthenticated()) {
    <nav class="nav-container">
        <!-- Горизонтальное меню (на больших экранах) -->
        @if (!isSmallScreen()) {
        <div class="nav-links">
            @for (item of menuItems; track item.label) {
            <sc-menu-item [item]="item"></sc-menu-item>
            }
        </div>
        }

        <!-- Гамбургер (на маленьких экранах) -->
        @if (isSmallScreen()) {
        <button mat-icon-button class="hamburger-button" [matMenuTriggerFor]="mobileMenu">
            <mat-icon>menu</mat-icon>
        </button>
        <mat-menu #mobileMenu="matMenu">
            @for (item of menuItems; track item.label) {
            <!-- Для мобильного меню используем тот же компонент, но с флагом isSubmenu -->
            <sc-menu-item [item]="item" [isSubmenu]="true"></sc-menu-item>
            }
        </mat-menu>
        }
    </nav>
    }

    <span class="spacer"></span>

    <!-- Правая часть: пользователь (только если авторизован) -->
    <div *ngIf="isAuthenticated()" class="user-section">
        <!-- Инициалы пользователя (аватар-заглушка) -->
        <div class="user-avatar" [matTooltip]="getFullName()" matTooltipPosition="below" (click)="openUserProfile()">
            {{ getUserInitials() }}
        </div>

        <!-- Имя пользователя с обрезанием и всплывающей подсказкой -->
        <span *ngIf="showName()" class="user-name" [matTooltip]="getFullName()" matTooltipPosition="below"
            (click)="openUserProfile()">
            {{ displayName() }}
        </span>

        <!-- Разделитель -->
        <span class="divider">|</span>

        <!-- Ссылка на выход -->
        <a mat-button class="logout-link" routerLink="/logout">
            Выйти
        </a>
    </div>
</mat-toolbar>
