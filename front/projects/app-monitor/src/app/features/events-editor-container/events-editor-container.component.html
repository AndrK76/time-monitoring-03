<div class="editor-container-wrapper">
  <div class="editor-header">
    <!-- Кнопка "Назад" слева -->
    <button mat-icon-button (click)="callBack()" matTooltip="Назад">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <!-- Группа кнопок справа -->
    <div class="editor-actions-top">
      <button mat-raised-button color="primary" (click)="applyChanges()" [disabled]="!dataChanged()">Применить</button>
      <button mat-raised-button (click)="rejectChanges()">Отмена</button>
    </div>
  </div>

  <!-- Обёртка для прокрутки -->
  <div class="editor-scroll-wrapper">
    @if(inited) {
    <app-events-editor-inplace [eventData]="toEditItem()!" [places]="places()" [statuses]="statuses()"
      (change)="onChange($event)"></app-events-editor-inplace>
    }
  </div>
</div>
