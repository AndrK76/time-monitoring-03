<div class="standard-table-container">
    <mat-card>
        <!--
        <mat-card-actions align="end" class="inner-table">
            <div class="action-button-group">
                <button mat-raised-button class="table-action-btn btn-success" (click)="callAdd()">
                    <mat-icon>add</mat-icon><span class="hide-on-small">Добавить</span>
                </button>
                <button mat-raised-button class="table-action-btn btn-danger" (click)="callDelete(selectedItem()!)"
                    [disabled]="!selectedItem()">
                    <mat-icon>delete</mat-icon><span class="hide-on-small">Удалить</span>
                </button>
            </div>
        </mat-card-actions>
        -->


        <mat-card-content class="inner-table">
            @if(dataSource.data.length === 0) {
            <div class="empty-state inner-table">
                <mat-icon>info</mat-icon>
                <p>Пользователи не привязаны</p>
            </div>
            } <!-- Таблица -->
            <div class="able-wrapper sticky-header-table sticky-firstcol-table nowrap-table inrow-editor-table filtered-table click-edit-table"
                #tableWrapper [style.display]="dataSource.data.length === 0 ? 'none' : ''">
                <table mat-table [dataSource]="dataSource" [trackBy]="trackById" class="mat-elevation-z0" matSort>

                    <ng-container matColumnDef="expand">
                        <th mat-header-cell *matHeaderCellDef>
                            <button mat-icon-button (click)="toggleFilter()" matTooltip="Фильтр">
                                <mat-icon>filter_list</mat-icon>
                            </button>
                        </th>
                        <td mat-cell *matCellDef="let row">
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="displayName">
                        <th mat-header-cell *matHeaderCellDef>
                            <sc-filter-root key="displayName" label="Отображаемое имя" [showFilter]="showFilter()"
                                [sort]="true" [config]="filterConfig().get('displayName')!"
                                (change)="onFilterChange($event)"></sc-filter-root>
                        </th>
                        <td mat-cell *matCellDef="let row">
                            @if(row._expanded && selectedItem() ) {
                            <mat-form-field appearance="fill" class="full-width" (click)="callSelect(row)">
                                <mat-select [value]="selectedItem()?.id"
                                    (selectionChange)="onChangeSelectedUser($event)">
                                    <mat-option *ngFor="let user of avaibleUsers()" [value]="user.id">
                                        {{user.displayName}}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>
                            } @else {
                            {{row.displayName}}
                            }
                        </td>
                        <!--<mat-form-field appearance="fill" class="full-width" (click)="callSelect(row)">
                                <mat-select [(value)]="row.selectedUserId" (valueChange)="onUserChange(row)">
                                    <mat-option *ngFor="let user of availableUsersForRow(row)" [value]="user.id">
                                        {{ user.displayName || user.username }}
                                    </mat-option>
                                    <mat-option value="">— Не выбран —</mat-option>
                                </mat-select>
                            </mat-form-field>
                                -->
                    </ng-container>

                    <ng-container matColumnDef="username">
                        <th mat-header-cell *matHeaderCellDef>
                            <sc-filter-root key="username" label="Имя пользователя" [showFilter]="showFilter()"
                                [sort]="true" [config]="filterConfig().get('username')!"
                                (change)="onFilterChange($event)"></sc-filter-root>
                        </th>
                        <td mat-cell *matCellDef="let row"> {{row.username}} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="callSelect(row)"
                        class="simple-row" [attr.data-id]="row.id"></tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>
</div>
