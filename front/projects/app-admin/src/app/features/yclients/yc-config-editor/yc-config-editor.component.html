<div class="editor-container-wrapper">

    <!-- Заголовок -->
    <div class="editor-header">
        <div class="editor-title">
            <span>Настройка </span><span *ngIf="!isSmallScreen()">агента CRM YClients: </span><span>{{ agent()?.name ??
                '' }}</span>
        </div>
    </div>

    <!-- Строка действий: ссылка слева, кнопки справа -->
    <div class="editor-header">
        <div class="action-button-group">
            <a mat-button class="table-action-btn back-button" matTooltip="К списку агентов" [routerLink]="agentPage"
                [queryParams]="agentIdParams()">
                <mat-icon>arrow_back</mat-icon>
                <span class="hide-on-small">К списку агентов</span>
            </a>
        </div>
        <div class="action-button-group">
            <button mat-raised-button class="table-action-btn btn-light" (click)="callRefresh()"
                [disabled]="isLoading()">
                <mat-icon>refresh</mat-icon>
                <span class="hide-on-small">{{ isLoading() ? 'Загрузка...' : 'Перечитать' }}</span>
            </button>
            <button mat-raised-button color="primary" (click)="callSave()"
                [disabled]="isLoading() || hasError() || !hasChanges()">
                <mat-icon>save</mat-icon>
                <span class="hide-on-small">Сохранить</span>
            </button>
        </div>
    </div>

    <!-- Состояния загрузки / ошибки -->
    @if (isLoading()) {
    <div class="loading-spinner">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Загрузка данных...</p>
    </div>
    } @else if (hasError()) {
    <div class="error-message">
        <mat-icon color="warn">error</mat-icon>
        <span>Ошибка:</span>
        <span>{{ error().message }}</span>
    </div>
    } @else {

    <!-- Readonly-форма с информацией об агенте -->
    <div class="editor-container">
        <div class="editor-form">
            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Название агента</mat-label>
                    <input matInput [value]="agent()?.name ?? ''" readonly>
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Организация</mat-label>
                    <input matInput [value]="agent()?.organization?.shortName ?? ''" readonly>
                </mat-form-field>
            </div>
        </div>
    </div>

    <mat-divider class="section-divider"></mat-divider>

    <!-- Реактивная форма настроек (несколько областей) -->
    <div class="editor-container">
        <form [formGroup]="form" class="editor-form">
            <div class="form-row"><span class="label">Настройка API</span></div>

            <!-- Область: доступы (API) -->
            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>API URL</mat-label>
                    <input matInput formControlName="apiUrl">
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Токен партнера</mat-label>
                    <input matInput formControlName="partnerToken">
                </mat-form-field>
            </div>
            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Токен пользователя</mat-label>
                    <input matInput formControlName="userToken">
                </mat-form-field>
                <div class="action-button-group">
                    <button mat-raised-button class="table-action-btn btn-gray" (click)="callGetUserToken()">
                        <mat-icon>vpn_key</mat-icon>
                        <span>Получить токен</span>
                    </button>
                </div>
            </div>

            <!-- Здесь позже появятся другие области -->

        </form>
    </div>

    }
</div>
