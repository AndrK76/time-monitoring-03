<div class="editor-container" *ngIf="userData()">
    <div class="editor-form-wrapper" style="position: relative;">
        <!-- Оверлей загрузки -->
        @if (loading()) {
        <div class="loading-overlay">
            <mat-spinner diameter="40"></mat-spinner>
            <p>Загрузка данных...</p>
        </div>
        }

        <!-- Шапка редактора с кнопками -->
        <div class="editor-header">
            <div class="editor-header-actions">
                <button mat-raised-button [color]="data.active ? 'warn' : 'primary'"
                    [disabled]="loading() || isSomeUser()" (click)="toggleActive()"
                    *ngIf="canFullUpdate() && (isSuperUser() || !data.superUser)">
                    <mat-icon>{{ data.active ? 'lock' : 'lock_open' }}</mat-icon>
                    <span class="button-text">{{ data.active ? 'Заблокировать' : 'Разблокировать' }}</span>
                </button>
                <button mat-raised-button color="primary" [disabled]="loading() || data.approved"
                    (click)="toggleApproved()" *ngIf="canFullUpdate()">
                    <mat-icon>{{ data.approved ? 'check_circle' : 'check_circle_outline' }}</mat-icon>
                    <span class="button-text">{{ data.approved ? 'Подтверждён' : 'Подтвердить' }}</span>
                </button>
                <button mat-raised-button color="accent" [disabled]="loading()" (click)="openChangePassword()"
                    *ngIf="canFullUpdate() && (isSuperUser() || !data.superUser)|| isSomeUser()">
                    <mat-icon>vpn_key</mat-icon>
                    <span class="button-text">Сменить пароль</span>
                </button>
            </div>
        </div>

        <form [formGroup]="form" class="editor-form">
            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Login</mat-label>
                    <input matInput formControlName="username" (change)="$event.stopPropagation()">
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>ID</mat-label>
                    <input matInput formControlName="id" readonly>
                </mat-form-field>
            </div>

            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" type="email" (change)="$event.stopPropagation()">
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Отображаемое имя</mat-label>
                    <input matInput formControlName="displayName" (change)="$event.stopPropagation()">
                </mat-form-field>
            </div>

            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Имя</mat-label>
                    <input matInput formControlName="firstName" (change)="$event.stopPropagation()">
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Фамилия</mat-label>
                    <input matInput formControlName="lastName" (change)="$event.stopPropagation()">
                </mat-form-field>
            </div>

            <div class="form-row" *ngIf="staticRoles().length">
                <div class="badges-container">
                    Роли:
                    <span class="badge" *ngFor="let role of staticRoles()">
                        {{ roleById(role)?.description }}
                    </span>
                </div>
            </div>

            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Роли</mat-label>
                    <mat-select formControlName="roles" multiple>
                        <mat-option *ngFor="let role of rolesForShow()" [value]="role.name">
                            {{ role.description || role.name }} {{ role.special?'(!)':'' }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <!-- Строка с организациями -->
            <div class="form-row">
                <div class="badges-container">
                    Организации:
                    <span class="badge" *ngFor="let org of organizations()">
                        {{ org.fullName }}
                    </span>
                    <span *ngIf="organizations().length === 0" class="empty-badge">—</span>
                </div>
            </div>
        </form>
    </div>
</div>
