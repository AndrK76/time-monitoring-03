<div class="editor-container" *ngIf="userData()">
    <div class="editor-form-wrapper" style="position: relative;">
        <!-- Оверлей загрузки -->
        @if (loading()) {
        <div class="loading-overlay">
            <mat-spinner diameter="40"></mat-spinner>
            <p>Загрузка данных...</p>
        </div>
        }
        <form [formGroup]="form" class="editor-form">
            <!-- все поля без изменений -->
            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>ID</mat-label>
                    <input matInput formControlName="id" readonly>
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Имя пользователя</mat-label>
                    <input matInput formControlName="username">
                </mat-form-field>
            </div>

            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" type="email">
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Отображаемое имя</mat-label>
                    <input matInput formControlName="displayName">
                </mat-form-field>
            </div>

            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Имя</mat-label>
                    <input matInput formControlName="firstName">
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Фамилия</mat-label>
                    <input matInput formControlName="lastName">
                </mat-form-field>
            </div>

            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Роли</mat-label>
                    <mat-select formControlName="roles" multiple>
                        <mat-option *ngFor="let role of roles()" [value]="role.name">
                            {{ role.description || role.name }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <div class="form-row checkbox-row">
                <mat-checkbox formControlName="active">Активен</mat-checkbox>
                <mat-checkbox formControlName="approved">Подтверждён</mat-checkbox>
            </div>
        </form>
    </div>
</div>
