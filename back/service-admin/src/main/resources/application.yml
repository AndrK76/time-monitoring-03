spring:
  application:
    name: service-admin
  config:
    import: optional:file:.properties

  web:
    cors:
      allowed-origins:
        - "http://localhost:4301"
        - "http://localhost:4302"
        - "http://crm.host:4301"
        - "http://admin.crm.host:4302"
        - "http://crm.host:8701"
        - "http://admin.crm.host:8702"
        - "http://crm.host:8888"
        - "http://admin.crm.host:8888"
        - "http://crm.host:8881"
        - "http://admin.crm.host:8882"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      allowed-headers: "Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers"
      exposed-headers: "Authorization,Set-Cookie"
      allow-credentials: true
      max-age: 3600

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: admin
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: admin
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 5
        retry:
          enabled: true
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0
          max-attempts: 3
      template:
        retry:
          enabled: true
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0
          max-attempts: 3
  
  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: ${YANDEX_CLIENT_ID:}
            client-secret: ${YANDEX_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - login:email
              - login:info
          vk:
            client-id: ${VK_CLIENT_ID:}
            client-secret: ${VK_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: id
          vk:
            authorization-uri: https://oauth.vk.com/authorize
            token-uri: https://oauth.vk.com/access_token
            user-info-uri: https://api.vk.com/method/users.get
            user-name-attribute: id

server:
  port: 8082

logging:
  level:
    ru.igorit.monitoring: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.amqp: WARN

security:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production000}
    expiration: 86400000
  telegram:
    token-ttl: 300
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-name: ${TELEGRAM_BOT_NAME:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    rabbit.enabled: false
    redis.enabled: false
