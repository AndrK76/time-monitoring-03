spring:
  application:
    name: service-monitoring
  config:
    import: optional:file:.properties
  
  datasource:
    url: jdbc:postgresql://localhost:5432/monitoring_db
    username: monitoring_user
    password: monitoring_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: ${YANDEX_CLIENT_ID:}
            client-secret: ${YANDEX_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - login:email
              - login:info
          vk:
            client-id: ${VK_CLIENT_ID:}
            client-secret: ${VK_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: id
          vk:
            authorization-uri: https://oauth.vk.com/authorize
            token-uri: https://oauth.vk.com/access_token
            user-info-uri: https://api.vk.com/method/users.get
            user-name-attribute: id
  
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

logging:
  level:
    ru.igorit.monitoring: DEBUG

security:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production00}
    expiration: 86400000
  telegram:
    token-ttl: 300
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-name: ${TELEGRAM_BOT_NAME:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics