spring:
  application:
    name: service-auth
  config:
    import: optional:file:../.properties,optional:file:.properties,optional:file:service-auth/.properties

  web:
    cors:
      allowed-origins:
        - "http://localhost:4301"
        - "http://localhost:4302"
        - "http://crm.host:4301"
        - "http://admin.crm.host:4302"
        - "http://crm.host:8701"
        - "http://admin.crm.host:8702"
        - "http://crm.host:8888"
        - "http://admin.crm.host:8888"
        - "http://crm.host:8881"
        - "http://admin.crm.host:8882"
        - "http://admin.crm.host:4311"
        - "http://crm.host:4312"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      allowed-headers: "Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers"
      exposed-headers: "Authorization,Set-Cookie"
      allow-credentials: true
      max-age: 3600

  datasource:
    url: ${POSTGRES_URL}
    username: ${PG_USER}
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
      #ddl-auto: validate
    open-in-view: false
    show-sql: false
    #show-sql: true
    properties:
      hibernate:
        #format_sql: true
        #dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl.auto: validate
        schema-validation: none

  flyway:
    enabled: true
    #enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: auth
    baseline-version: 0

  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 5
        retry:
          enabled: true
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0
          max-attempts: 3
      template:
        retry:
          enabled: true
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0
          max-attempts: 3


  # ============================================================
  # Redis - ОТКЛЮЧЕН (закомментирован)
  # ============================================================
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379
  #     timeout: 2000ms
  #     lettuce:
  #       pool:
  #         max-active: 8
  #         max-idle: 8
  #         min-idle: 0





server:
  port: 8083

# Cookie настройки для SSO
cookie:
  domain: crm.host           # ← общий домен для всех поддоменов
  #domain: andrk-ninkear.host           # ← общий домен для всех поддоменов
  #domain: host           # ← общий домен для всех поддоменов
  secure: false               # false для HTTP, true для HTTPS
  http-only: true
  max-age: 86400              # 24 часа
  path: /
  name: auth_token

security:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
    expiration: 6000000
    refresh-expiration: 12000000
  telegram:
    token-ttl: 300

logging:
  level:
    ru.igorit.monitoring: DEBUG
    №org.springframework.security: INFO
    org.springframework.security: DEBUG
    #org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    root: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false